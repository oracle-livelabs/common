server {
  listen ${QA_PORTAL_INTERNAL_PORT} ssl;
  server_name _;

  server_tokens off;
  ssl_certificate /run/secrets/portal_tls_certificate;
  ssl_certificate_key /run/secrets/portal_tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Content-Security-Policy "default-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/par-link/resolve {
    auth_basic "LiveLabs QA reports";
    auth_basic_user_file /var/run/reports.htpasswd;
    limit_except POST {
      deny all;
    }
    client_max_body_size 8k;
    proxy_pass http://par-resolver:${QA_PAR_RESOLVER_INTERNAL_PORT}/resolve;
    proxy_http_version 1.1;
    proxy_set_header Host livelabs-qa-par-resolver;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
  }

  location = / {
    auth_basic "LiveLabs QA reports";
    auth_basic_user_file /var/run/reports.htpasswd;
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }

  location = /par {
    return 302 /par/;
  }

  location ^~ /par/ {
    auth_basic "LiveLabs QA reports";
    auth_basic_user_file /var/run/reports.htpasswd;
    root /srv/reports;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location = /regression {
    return 302 /regression/;
  }

  location ^~ /regression/ {
    auth_basic "LiveLabs QA reports";
    auth_basic_user_file /var/run/reports.htpasswd;
    root /srv/reports;
    index index.html;
    try_files $uri $uri/ =404;
  }

  location ^~ /jenkins/ {
    proxy_pass http://jenkins:${QA_JENKINS_INTERNAL_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
  }
}
