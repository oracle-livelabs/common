services:
  jenkins:
    build:
      context: ../..
      dockerfile: deploy/vm/jenkins/Containerfile
    image: livelabs-qa-jenkins:local
    restart: unless-stopped
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_OPTS: --httpPort=32080 --prefix=/jenkins
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-qa-admin}
      QA_PUBLIC_URL: ${QA_PUBLIC_URL:-https://localhost:32443}
      QA_GIT_URL: ${QA_GIT_URL:-https://github.com/oracle-livelabs/common.git}
      QA_GIT_BRANCH: ${QA_GIT_BRANCH:-*/main}
      QA_GIT_CREDENTIAL_ID: ${QA_GIT_CREDENTIAL_ID:-}
      QA_NIGHTLY_CRON: ${QA_NIGHTLY_CRON:-H H(1-4) * * *}
      QA_PAR_CRON: ${QA_PAR_CRON:-H H(1-4) * * 0}
      QA_AUTH_TARGET_URL: ${QA_AUTH_TARGET_URL:-}
      QA_BASE_URL: ${QA_BASE_URL:-}
      QA_ROOT_REPORTS_BASE: /var/qa-reports
      QA_OBJECT_STORAGE_NAMESPACE: ${QA_OBJECT_STORAGE_NAMESPACE:-}
      QA_OBJECT_STORAGE_BUCKET: ${QA_OBJECT_STORAGE_BUCKET:-}
      QA_OBJECT_STORAGE_PREFIX: ${QA_OBJECT_STORAGE_PREFIX:-livelabs-qa}
      QA_OCI_AUTH_MODE: ${QA_OCI_AUTH_MODE:-instance_principal}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    secrets:
      - jenkins_admin_secret
      - livelabs_username
      - livelabs_secret
    volumes:
      - jenkins_home:/var/jenkins_home
      - qa_reports:/var/qa-reports
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:32080/jenkins/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - qa_internal

  portal:
    build:
      context: ../..
      dockerfile: deploy/vm/portal/Containerfile
    image: livelabs-qa-portal:local
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    ports:
      - "${QA_BIND_ADDRESS:-127.0.0.1}:${QA_HTTPS_PORT:-32443}:32444"
    secrets:
      - reports_htpasswd
      - portal_tls_certificate
      - portal_tls_key
    volumes:
      - qa_reports:/srv/reports:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1:32444/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - qa_internal

secrets:
  jenkins_admin_secret:
    file: ./secrets/jenkins-admin-secret
  livelabs_username:
    file: ./secrets/livelabs-username
  livelabs_secret:
    file: ./secrets/livelabs-secret
  reports_htpasswd:
    file: ./secrets/reports.htpasswd
  portal_tls_certificate:
    file: ./secrets/tls.crt
  portal_tls_key:
    file: ./secrets/tls.key

volumes:
  jenkins_home:
  qa_reports:

networks:
  qa_internal:
    driver: bridge