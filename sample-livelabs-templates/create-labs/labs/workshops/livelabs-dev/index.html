<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Oracle LiveLabs gives you access to Oracle's products to run a wide variety of labs and workshops; allowing you to experience our best technology, live!">
    <title>Oracle LiveLabs</title>

    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/js/jquery-1.11.0.min.js"></script>
    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/js/jquery-ui-1.10.4.custom.js"></script>
    <script src="https://livelabs.oracle.com/cdn/common/redwood-hol/development/js/main.26.4.js"></script>

    <link rel="stylesheet" href="https://livelabs.oracle.com/cdn/common/redwood-hol/development/css/style.26.4.css" />
    <link rel="shortcut icon" href="https://livelabs.oracle.com/cdn/common/redwood-hol/img/favicon.ico" />
    
</head>

<body>
    <header class="hol-Header" role="banner">
        <div class="hol-Header-wrap">
            <div class="hol-Header-logo"><span>Oracle LiveLabs</span></div>
            <div class="hol-Header-actions">
                <button id="openNav" class="hol-Header-button hol-Header-button--menu rightNav"
                    aria-label="Show lab navigation" title="Show lab navigation" aria-controls="leftNav" aria-expanded="false">
                    <svg class="hol-Header-panelIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <path d="M9 3v18"></path>
                        <path class="hol-Header-panelIcon-open" d="m14 9 3 3-3 3"></path>
                        <path class="hol-Header-panelIcon-close" d="m17 9-3 3 3 3"></path>
                    </svg>
                </button>
            </div>
            <div class="hol-Header-tools">
                <button id="themeToggle" class="hol-Header-themeToggle" type="button"
                    aria-label="Dark mode" title="Switch to dark mode" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path class="theme-icon-moon" d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path>
                        <g class="theme-icon-sun">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
                        </g>
                    </svg>
                </button>
                <a href="https://livelabs.oracle.com" target="_blank" id="livelabs" title="Oracle LiveLabs" aria-label="Oracle LiveLabs"></a>
            </div>
        </div>
    </header>

    <div id="container">
        <div id="leftNav">
            <div id="toc"></div>
        </div>
        <div id="contentBox">
            <main class="hol-Content" id="module-content"></main>
            <nav class="hol-Content-nav" aria-label="Lab navigation">
                <a class="hol-Footer-leftLink hide"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"></path></svg><span>Back</span></a>
                <a class="hol-Footer-rightLink hide"><span>Next</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"></path></svg></a>
            </nav>
        </div>
    </div>

      <footer class="hol-Footer">
        <div id="footer-banner"><div class="footer-row">
          <div class="footer-content"><ul class="footer-links" aria-label="Oracle legal and company links">
              <li><a href="https://www.oracle.com/legal/copyright.html" data-lbl="copyright">© Oracle</a></li>
              <li><a href="https://www.oracle.com/legal/privacy/">Privacy</a> / <a href="https://www.oracle.com/legal/privacy/privacy-choices.html">Do Not Sell My Info</a></li>
              <li><a href="https://www.oracle.com/legal/privacy/privacy-choices.html">Cookie Preferences</a></li>
              <li><a href="https://www.oracle.com/legal/privacy/privacy-policy/#adchoices">Ad Choices</a></li>
              <li><a href="https://www.oracle.com/corporate/careers/">Careers</a></li>
              <li><a href="https://www.oracle.com/connect/">Subscribe to emails</a></li>
              <li><a href="https://secure.ethicspoint.com/domain/media/en/gui/31053/index.html">Integrity Helpline</a></li>
              <li><a href="https://www.oracle.com/corporate/resources/">Resources</a></li>
              <li><a href="https://www.oracle.com/corporate/contact/">Contact Us</a></li>
            </ul></div>
        </div>
      </div>
    </footer>
</body>

</html>
