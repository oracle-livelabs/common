<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Preview, QA, then a reviewed push</title><desc id="desc">Asynchronous LiveLabs MCP workflow with separate preview and QA statuses.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#386a60" stroke-width="1.5"/></marker></defs><rect width="1120" height="650" rx="18" fill="#f6f5ef"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="16" fill="#526c62" font-weight="650">NODOC / CODEX</text><text x="40" y="88" font-size="32" fill="#243637" font-weight="650">Preview, QA, then a reviewed push</text><text x="40" y="126" font-size="21" fill="#243637" font-weight="400">Track one request ID from preview creation through QA and review.</text><rect x="40" y="162" width="315" height="145" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="40" y="176" width="5" height="117" rx="2" fill="#386a60"/><text x="64" y="201" font-size="24" fill="#243637" font-weight="650">1  Start preview</text><text x="64" y="239" font-size="20" fill="#243637" font-weight="400">Exact article + version</text><text x="64" y="269" font-size="20" fill="#243637" font-weight="400">Returns request_id</text><text x="64" y="299" font-size="20" fill="#243637" font-weight="400">No content pushed live.</text><rect x="402" y="162" width="315" height="145" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="402" y="176" width="5" height="117" rx="2" fill="#386a60"/><text x="426" y="201" font-size="24" fill="#243637" font-weight="650">2  Check status</text><text x="426" y="239" font-size="20" fill="#243637" font-weight="400">pending → processing</text><text x="426" y="269" font-size="20" fill="#243637" font-weight="400">get_pre_publish_status</text><text x="426" y="299" font-size="20" fill="#243637" font-weight="400">Poll the same request ID.</text><rect x="763" y="162" width="317" height="145" rx="14" fill="#e7efe8" stroke="#cbd5cd"/><rect x="763" y="176" width="5" height="117" rx="2" fill="#386a60"/><text x="787" y="201" font-size="24" fill="#243637" font-weight="650">3  Preview ready</text><text x="787" y="239" font-size="20" fill="#243637" font-weight="400">ready</text><text x="787" y="269" font-size="20" fill="#243637" font-weight="400">Preview / download links</text><text x="787" y="299" font-size="20" fill="#243637" font-weight="400">Accessibility report link.</text><path d="M356 230 L395 230" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M718 230 L756 230" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="763" y="375" width="317" height="156" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="763" y="389" width="5" height="128" rx="2" fill="#386a60"/><text x="787" y="414" font-size="24" fill="#243637" font-weight="650">4  Run LiveLabs QA</text><text x="787" y="452" font-size="20" fill="#243637" font-weight="400">run_livelabs_qa</text><text x="787" y="482" font-size="20" fill="#243637" font-weight="400">processing → completed</text><text x="787" y="512" font-size="20" fill="#243637" font-weight="400">Review page findings.</text><rect x="402" y="375" width="315" height="156" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="402" y="389" width="5" height="128" rx="2" fill="#386a60"/><text x="426" y="414" font-size="24" fill="#243637" font-weight="650">5  Review + decide</text><text x="426" y="452" font-size="20" fill="#243637" font-weight="400">Inspect preview and QA.</text><text x="426" y="482" font-size="20" fill="#243637" font-weight="400">Fix issues if needed.</text><text x="426" y="512" font-size="20" fill="#243637" font-weight="400">Explicit push instruction.</text><rect x="40" y="375" width="315" height="156" rx="14" fill="#e7efe8" stroke="#cbd5cd"/><rect x="40" y="389" width="5" height="128" rx="2" fill="#386a60"/><text x="64" y="414" font-size="24" fill="#243637" font-weight="650">6  Push if approved</text><text x="64" y="452" font-size="20" fill="#243637" font-weight="400">Ready LiveLabs request</text><text x="64" y="482" font-size="20" fill="#243637" font-weight="400">push_pre_publish_livelabs</text><text x="64" y="512" font-size="20" fill="#243637" font-weight="400">Separate WMS handoff.</text><path d="M922 308 L922 368" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M762 452 L724 452" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M401 452 L362 452" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="42" y="585" font-size="22" fill="#9b3527" font-weight="650">If a tool reports error: stop and inspect the failure.</text><text x="42" y="619" font-size="20" fill="#243637" font-weight="400">Completed QA means the run finished. Read the findings before deciding to push.</text></g></svg>