<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Store the token for your Windows account</title><desc id="desc">The exact variable name goes in User variables, not System variables.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#386a60" stroke-width="1.5"/></marker></defs><rect width="1120" height="610" rx="18" fill="#f6f5ef"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="16" fill="#526c62" font-weight="650">NODOC / CODEX</text><text x="40" y="88" font-size="32" fill="#243637" font-weight="650">Store the token for your Windows account</text><text x="40" y="127" font-size="21" fill="#243637" font-weight="400">Follow these Windows controls in order. Illustration — not a screenshot.</text><rect x="40" y="165" width="320" height="130" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="40" y="179" width="5" height="102" rx="2" fill="#386a60"/><text x="64" y="204" font-size="24" fill="#243637" font-weight="650">1  System Properties</text><text x="64" y="242" font-size="20" fill="#243637" font-weight="400">Search: Edit the system</text><text x="64" y="272" font-size="20" fill="#243637" font-weight="400">environment variables</text><rect x="404" y="165" width="320" height="130" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="404" y="179" width="5" height="102" rx="2" fill="#386a60"/><text x="428" y="204" font-size="24" fill="#243637" font-weight="650">2  Environment Variables</text><text x="428" y="242" font-size="20" fill="#243637" font-weight="400">Open the dialog from</text><text x="428" y="272" font-size="20" fill="#243637" font-weight="400">System Properties.</text><rect x="768" y="165" width="312" height="130" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="768" y="179" width="5" height="102" rx="2" fill="#386a60"/><text x="792" y="204" font-size="24" fill="#243637" font-weight="650">3  User variables</text><text x="792" y="242" font-size="20" fill="#243637" font-weight="400">Choose your account,</text><text x="792" y="272" font-size="20" fill="#243637" font-weight="400">then select New.</text><path d="M361 230 L397 230" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M725 230 L761 230" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="150" y="349" width="820" height="178" rx="14" fill="#e7efe8" stroke="#cbd5cd"/><rect x="150" y="363" width="5" height="150" rx="2" fill="#386a60"/><text x="174" y="388" font-size="24" fill="#243637" font-weight="650">New User Variable</text><text x="174" y="426" font-size="20" fill="#243637" font-weight="400">Variable name    ASK_NODOC_MCP_TOKEN</text><text x="174" y="456" font-size="20" fill="#243637" font-weight="400">Variable value    [your complete personal token]</text><text x="174" y="486" font-size="20" fill="#243637" font-weight="400">Save with OK in each open dialog.</text><path d="M921 299 L921 343" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="154" y="570" font-size="22" fill="#243637" font-weight="650">Keep the value private. Restart Codex after saving the variable.</text></g></svg>