<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">Connect the config to the stored token</title><desc id="desc">Illustration of configuration references, with the secret value omitted.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#386a60" stroke-width="1.5"/></marker></defs><rect width="1120" height="500" rx="18" fill="#f6f5ef"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="16" fill="#526c62" font-weight="650">NODOC / CODEX</text><text x="40" y="88" font-size="32" fill="#243637" font-weight="650">Connect the config to the stored token</text><text x="40" y="128" font-size="21" fill="#243637" font-weight="400">config.toml names the variable. Windows holds its value.</text><rect x="40" y="175" width="525" height="212" rx="14" fill="#ffffff" stroke="#cbd5cd"/><rect x="40" y="189" width="5" height="184" rx="2" fill="#386a60"/><text x="64" y="214" font-size="24" fill="#243637" font-weight="650">Codex configuration</text><text x="64" y="252" font-size="20" fill="#243637" font-weight="400">[mcp_servers.nodoc]</text><text x="64" y="282" font-size="20" fill="#243637" font-weight="400">url = the NoDoc MCP endpoint</text><text x="64" y="312" font-size="20" fill="#243637" font-weight="400">bearer_token_env_var =</text><text x="64" y="342" font-size="20" fill="#243637" font-weight="400">&quot;ASK_NODOC_MCP_TOKEN&quot;</text><rect x="664" y="175" width="416" height="212" rx="14" fill="#e7efe8" stroke="#cbd5cd"/><rect x="664" y="189" width="5" height="184" rx="2" fill="#386a60"/><text x="688" y="214" font-size="24" fill="#243637" font-weight="650">Windows user variable</text><text x="688" y="252" font-size="20" fill="#243637" font-weight="400">Name: ASK_NODOC_MCP_TOKEN</text><text x="688" y="282" font-size="20" fill="#243637" font-weight="400">Value: [personal token]</text><text x="688" y="312" font-size="20" fill="#243637" font-weight="400">The name must match exactly.</text><path d="M570 318 L655 318" stroke="#386a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="586" y="298" font-size="17" fill="#243637" font-weight="400">reads</text><text x="43" y="444" font-size="22" fill="#243637" font-weight="650">Keep existing settings. Add one NoDoc section. Never put the secret in the file.</text></g></svg>