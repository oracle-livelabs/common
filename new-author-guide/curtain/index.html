<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#312d2a">
  <meta name="description" content="The Oracle LiveLabs Author Guide is temporarily unavailable while maintenance is in progress.">
  <title>Temporarily unavailable · Oracle LiveLabs Author Guide</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Oracle Sans", "Segoe UI", Arial, sans-serif;
      color: #201e1c;
      background: #f8f6f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background:
        radial-gradient(ellipse at 12% 88%, rgba(67, 124, 148, 0.09), transparent 36rem),
        radial-gradient(ellipse at 90% 8%, rgba(199, 70, 52, 0.09), transparent 34rem),
        #f8f6f4;
    }

    main {
      width: min(100%, 760px);
      overflow: hidden;
      border: 1px solid #ded9d5;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 22px 64px rgba(32, 30, 28, 0.1);
    }

    .accent {
      height: 12px;
      background: linear-gradient(90deg, #c74634 0 18%, #e6a480 18% 24%, #4c8582 24% 72%, #d5e2d9 72% 78%, #312d2a 78%);
    }

    .content { padding: clamp(2rem, 7vw, 4.5rem); }

    .brand {
      margin: 0 0 2.75rem;
      color: #312d2a;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 0 0 1rem;
      color: #4c7775;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 0.55rem;
      height: 0.55rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #c74634;
      content: "";
    }

    h1 {
      max-width: 15ch;
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    .message {
      max-width: 52ch;
      margin: 1.5rem 0 0;
      color: #5f5955;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      line-height: 1.65;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 2rem;
      padding: 0.65rem 0.9rem;
      border: 1px solid #e5ded9;
      border-radius: 999px;
      color: #514b47;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status::before {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #c74634;
      content: "";
    }

    footer {
      border-top: 1px solid #eee9e5;
      padding: 1.1rem clamp(2rem, 7vw, 4.5rem);
      color: #756e69;
      font-size: 0.85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="accent" aria-hidden="true"></div>
    <div class="content">
      <p class="brand">ORACLE <span aria-hidden="true">·</span> LiveLabs</p>
      <p class="eyebrow">Author guide maintenance</p>
      <h1 id="page-title">We’ll be back shortly.</h1>
      <p class="message">The Oracle LiveLabs Author Guide is temporarily unavailable while we complete maintenance. Please check back soon.</p>
      <p class="status">Maintenance in progress</p>
    </div>
    <footer>Thank you for your patience.</footer>
  </main>
</body>
</html>
