<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">LiveLabs event delivery overview</title>
  <desc id="desc">Four cards show how authors confirm venue readiness, request and test access, send prerequisites, and make the live go or no-go decision.</desc>
  <rect width="1200" height="620" fill="#f7f7f5"/>
  <g font-family="Arial, sans-serif" fill="#1f1f1f">
    <text x="70" y="56" font-size="32" font-weight="700">Request and deliver a LiveLabs event</text>
    <g><rect x="70" y="100" width="500" height="170" rx="8" fill="#fff" stroke="#5f6f52" stroke-width="3"/><text x="100" y="140" font-size="22" font-weight="700">1. Confirm event readiness</text><text x="100" y="178" font-size="18">Venue network, internet, and capacity.</text><text x="100" y="204" font-size="18">Building access, customer questions,</text><text x="100" y="230" font-size="18">platform review, and Secure Desktop needs.</text></g>
    <g><rect x="630" y="100" width="500" height="170" rx="8" fill="#fff" stroke="#7f5f4a" stroke-width="3"/><text x="660" y="140" font-size="22" font-weight="700">2. Request and test access</text><text x="660" y="178" font-size="18">Choose one attendee path, confirm capacity,</text><text x="660" y="204" font-size="18">request the event code, and run the exact dry run.</text><text x="660" y="240" font-size="18">Record the first ready screen and timing.</text></g>
    <g><rect x="70" y="330" width="500" height="170" rx="8" fill="#fff" stroke="#5c6f86" stroke-width="3"/><text x="100" y="370" font-size="22" font-weight="700">3. Send the preflight checklist</text><text x="100" y="408" font-size="18">Share the URL, event code, access path, account steps,</text><text x="100" y="434" font-size="18">workshop prerequisites, venue instructions, ready screen,</text><text x="100" y="460" font-size="18">provisioning time, and support contact.</text></g>
    <g><rect x="630" y="330" width="500" height="170" rx="8" fill="#fff" stroke="#63715f" stroke-width="3"/><text x="660" y="370" font-size="22" font-weight="700">4. Run the live go/no-go check</text><text x="660" y="408" font-size="18">Confirm the tested path, roles, connectivity,</text><text x="660" y="434" font-size="18">support route, fallback, and remaining risks.</text><text x="660" y="460" font-size="18">Start only when the delivery team is ready.</text></g>
    <rect x="70" y="550" width="1060" height="42" rx="8" fill="#eef3ea" stroke="#8ca17f" stroke-width="2"/><text x="100" y="578" font-size="18" font-weight="700">Keep one event runbook with owners, evidence, decisions, and customer answers.</text>
  </g>
</svg>
