    <h1>Test Management is part of QA Hub</h1>

    <p><a href="./legacy.html">Open the previous TMS and its browser data</a></p>
    <script type="module">
      const target = ['127.0.0.1', 'localhost'].includes(location.hostname) ? 'http://127.0.0.1:4192/#section=tests' : '../../../livelabs-qa-hub/app/dist/index.html#section=tests';
      document.querySelector('#hub-link').href = target;
      const oldObject = decodeURIComponent(location.hash.slice(1)).startsWith('object:');
      location.replace(oldObject ? './legacy.html' + location.hash : target);
    </script>
